<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Spotly — You're offline</title>
  <meta name="theme-color" content="#0F3D38" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0F3D38;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .offline-card {
      max-width: 360px;
      text-align: center;
    }
    .offline-icon {
      width: 72px; height: 72px;
      margin: 0 auto 24px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
    }
    .offline-icon svg { width: 34px; height: 34px; }
    /* Spotly wordmark — same markup/CSS as the "Spotly brand system" block in assets/app.css.
       Duplicated here on purpose: this page must work with nothing but itself when offline. */
    .offline-logo { display: flex; justify-content: center; margin-bottom: 26px; }
    .sp-wordmark { display: inline-block; white-space: nowrap; font-weight: 800; letter-spacing: -0.035em; line-height: 1; color: #fff; font-size: 34px; }
    .sp-wordmark .sp-o { display: inline-block; width: 0.76em; height: 0.76em; vertical-align: -0.11em; margin: 0 0.005em; overflow: visible; }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.6; margin-bottom: 28px; }
    .retry-btn {
      height: 48px; padding: 0 28px;
      background: #4ADE80; color: #0F3D38;
      font-size: 14px; font-weight: 600;
      border: none; border-radius: 10px;
      cursor: pointer; transition: opacity 150ms ease;
    }
    .retry-btn:active { opacity: 0.85; }
  </style>
</head>
<body>
  <!-- Shared search-style "O" (same drawing as <symbol id="sp-o"> in index.html) -->
  <svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="sp-o-ring" gradientUnits="userSpaceOnUse" x1="6" y1="4" x2="50" y2="52"><stop offset="0" stop-color="#2BE04F"/><stop offset="1" stop-color="#05B26B"/></linearGradient>
      <linearGradient id="sp-o-handle" gradientUnits="userSpaceOnUse" x1="42" y1="42" x2="58" y2="58"><stop offset="0" stop-color="#05B26B"/><stop offset="1" stop-color="#1C78C8"/></linearGradient>
      <symbol id="sp-o" viewBox="0 0 64 64">
        <circle cx="27.5" cy="27.5" r="20.5" fill="none" stroke="url(#sp-o-ring)" stroke-width="12"/>
        <path d="M42 42 L57.5 57.5" fill="none" stroke="url(#sp-o-handle)" stroke-width="9" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>
  <div class="offline-card">
    <div class="offline-logo"><span class="sp-wordmark" role="img" aria-label="Spotly">Sp<svg class="sp-o" aria-hidden="true" focusable="false" viewBox="0 0 64 64"><use href="#sp-o"/></svg>tly</span></div>
    <div class="offline-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6">
        <path d="M12 18h.01M8.5 14.5a5 5 0 0 1 7 0M5.5 11a9.5 9.5 0 0 1 13 0M2.5 7.5a14 14 0 0 1 19 0" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
        <path d="M1 1l22 22" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Previously viewed content is still available.<br>Reconnect to keep discovering properties near you.</p>
    <button class="retry-btn" onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
